[project]
name = "ai-demo"
version = "0.1.0"
description = "Local chat-with-your-docs demo: RAG + tool-using agent on Ollama (DDD)"
readme = "README.md"
authors = [
    { name = "Hao", email = "192075106+haohuynhwork@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi>=0.163.1",
    "ollama>=0.6.3",
    "pydantic-settings>=2.16.3",
    "pypdf>=7.1.0",
    "python-multipart>=0.0.34",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
ai-demo = "ai_demo.interfaces.api.main:run"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
packages = ["ai_demo"]
mypy_path = "src"
ignore_missing_imports = true
